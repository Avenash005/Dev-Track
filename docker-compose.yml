# ==============================================================================
# DevTrack AI — Complete Multi-Service Docker Compose Orchestration
# Services:
#   1. frontend : React 18 + Vite Production Build served via Nginx (Port 80, 5173)
#   2. backend  : Express.js REST API + SSR Engine (Port 5000)
#   3. postgres : PostgreSQL 16 Relational Database (Port 5432)
#   4. mongodb  : MongoDB 7.0 Document Database (Port 27017)
#   5. ollama   : Local LLM Engine for llama3.2 (Port 11434)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Relational: Users, Projects, Tasks, Subscriptions)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: devtrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-devtrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devtrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devtrack-network

  # ----------------------------------------------------------------------------
  # 2. MongoDB Database Service (Document: AI Conversations & Chat Messages)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: devtrack_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devtrack-network

  # ----------------------------------------------------------------------------
  # 3. Ollama Local LLM Service (Offline AI Mentorship)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: devtrack_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devtrack-network

  # ----------------------------------------------------------------------------
  # 4. Backend Express API & SSR Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devtrack_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Use Docker internal service DNS hostnames instead of localhost
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/devtrack_db?schema=public}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/devtrack_ai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      JWT_SECRET: ${JWT_SECRET:-devtrack_ai_secret_jwt_key_9f13b92c_2026_academic_term}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_DevTrackKey2026}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-devtrack_razorpay_secret_test_2026}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - devtrack-network

  # ----------------------------------------------------------------------------
  # 5. Frontend Production Web Server (React 18 + Vite served by Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: devtrack_frontend
    restart: unless-stopped
    ports:
      - "80:80"     # Standard HTTP production port
      - "5173:80"   # Vite standard port mapping for developer convenience
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - devtrack-network

# ------------------------------------------------------------------------------
# Persistent Volumes (Data remains intact across container restart cycles)
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: devtrack_postgres_data
  mongo_data:
    name: devtrack_mongo_data
  ollama_models:
    name: devtrack_ollama_models

# ------------------------------------------------------------------------------
# Isolated Bridge Network (Service DNS discovery: backend, postgres, mongodb, ollama)
# ------------------------------------------------------------------------------
networks:
  devtrack-network:
    name: devtrack-network
    driver: bridge
